<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResearchFlow Web Preview</title><style>:root{--bg:#f4f6fb;--p:#fff;--t:#172033;--m:#6b7280;--b:#e5e7eb;--a:#3159d9;--a2:#eef2ff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:22px 14px;border-right:1px solid var(--b);background:#fff;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;padding:0 10px 18px}.brand small{display:block;color:var(--m);font-size:11px;font-weight:500}.nav button{display:block;width:100%;border:0;background:transparent;padding:11px 12px;border-radius:11px;text-align:left;margin:4px 0;font-weight:650;color:var(--m)}.nav button.on{background:var(--a2);color:var(--a)}.main{min-width:0}.top{height:66px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.content{max-width:1320px;margin:auto;padding:22px 24px 90px}.hero{background:linear-gradient(135deg,#172554,#3159d9);color:#fff;padding:30px;border-radius:24px;display:grid;grid-template-columns:1.4fr .6fr;gap:20px}.hero h1{font-size:38px;line-height:1.05;margin:8px 0}.hero p{color:#d8e0ff;line-height:1.6}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats div{background:#ffffff18;border:1px solid #ffffff22;padding:14px;border-radius:14px}.stats b{display:block;font-size:26px}.sec{display:flex;justify-content:space-between;align-items:end;margin:24px 0 12px}.sec h2{font-size:18px;margin:0}.muted{color:var(--m);font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel,.row{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:15px}.card h3,.row h3{font-size:15px;line-height:1.35;margin:10px 0 6px}.tag{display:inline-block;background:var(--a2);color:var(--a);padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700}.btn{border:1px solid var(--b);background:#fff;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer}.btn.p{background:var(--a);color:#fff;border-color:var(--a)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.list{display:flex;flex-direction:column;gap:8px}.row{display:flex;justify-content:space-between;gap:14px;align-items:center}.search{display:flex;gap:8px;background:#fff;border:1px solid var(--b);border-radius:13px;padding:9px 11px}.search input{flex:1;border:0;outline:0}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chip{border:1px solid var(--b);background:#fff;padding:7px 10px;border-radius:999px;font-size:11px}.chip.on{background:var(--a2);color:var(--a)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.setting{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--b)}.setting:last-child{border-bottom:0}.setting strong{font-size:13px;display:block}.topic{display:inline-flex;gap:6px;align-items:center;background:var(--a2);color:var(--a);padding:7px 9px;border-radius:999px;font-size:11px;margin:4px}.modalbg{position:fixed;inset:0;background:#0b102166;backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modalbg.show{display:flex}.modal{width:min(900px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:22px}.mh{padding:14px 18px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;position:sticky;top:0;background:#fff}.mb{padding:20px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:22px}.brief{background:#f8fafc;border:1px solid var(--b);border-radius:14px;padding:15px}.brief div{padding:10px 0;border-bottom:1px solid var(--b)}.brief div:last-child{border-bottom:0}.reader{position:fixed;inset:0;background:#eef1f7;display:none;grid-template-rows:58px 1fr;z-index:80}.reader.show{display:grid}.rt{display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--b);padding:0 12px}.rb{display:grid;grid-template-columns:180px 1fr 340px;min-height:0}.outline,.ai{background:#fff;padding:13px;overflow:auto}.outline{border-right:1px solid var(--b)}.ai{border-left:1px solid var(--b);display:flex;flex-direction:column}.paperwrap{overflow:auto;padding:24px;display:flex;justify-content:center}.paper{width:min(760px,100%);min-height:1000px;background:#fff;padding:56px 60px;box-shadow:0 16px 40px #27304a22}.paper h1{font-family:Georgia,serif;font-size:29px}.paper h2{font-family:Georgia,serif;font-size:18px;margin-top:28px}.paper p{font:15px/1.75 Georgia,serif;text-align:justify}.paper .sel{background:#fff0a4}.ai .box{background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:12px;font-size:12px;line-height:1.6;margin-top:10px}.cite{background:var(--a2);color:var(--a);padding:9px;border-radius:9px;margin-top:10px;cursor:pointer}.aiBtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.aiBtns button{border:1px solid var(--b);background:#fff;padding:8px;border-radius:9px;font-size:11px;font-weight:700}.capture{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px}.capture button{border:1px solid var(--b);background:#fff;padding:8px;border-radius:9px;font-size:11px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 13px;border-radius:10px;display:none;z-index:200}.mobile{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:1fr 1fr}.rb{grid-template-columns:1fr}.outline{display:none}.ai{position:absolute;right:0;top:58px;bottom:0;width:min(380px,94vw)}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:10px;left:10px;right:10px;background:#fff;border:1px solid var(--b);border-radius:16px;padding:6px;z-index:30}.mobile button{border:0;background:transparent;padding:8px 3px;font-size:10px}}@media(max-width:650px){.content{padding:14px 12px 82px}.hero{grid-template-columns:1fr;padding:21px}.hero h1{font-size:29px}.cards,.grid2,.detail{grid-template-columns:1fr}.paperwrap{padding:10px}.paper{padding:35px 22px}.row{align-items:flex-start;flex-direction:column}}</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>const P=[{id:'p1',topic:'AI Systems',title:'Efficient Long-Context Reasoning in Small Language Models',authors:'M. Chen, A. Patel, L. Ross',match:97,reason:'Long-context reasoning + inspectable AI systems',abs:'Long-context models can ingest more text than they can reliably reason over. This work studies evidence-density bottlenecks and introduces source-preserving context routing.',brief:['Long contexts do not automatically improve evidence selection.','Hierarchical routing compresses and reranks candidate evidence while preserving provenance.','Verification becomes faster because generated claims remain traceable to exact evidence.','Evaluation focuses on technical literature.']},{id:'p2',topic:'RAG',title:'Retrieval-Augmented Generation Without a Vector Database',authors:'S. Nakamura, J. Kim',match:94,reason:'RAG architecture + local-first retrieval',abs:'This study evaluates lexical-first local retrieval with BM25 and structural reranking on bounded technical corpora.',brief:['Dense retrieval is frequently adopted before requirements are understood.','FTS/BM25 plus structural reranking and provenance metadata.','Competitive bounded-corpus retrieval with lower complexity.','Large heterogeneous corpora may still benefit from dense retrieval.']},{id:'p3',topic:'Human-AI Interaction',title:'Designing Trustworthy AI Reading Assistants for Scientific Work',authors:'E. Martin, Y. Lee',match:92,reason:'AI reading UX + verification behavior',abs:'Reading assistants can accelerate comprehension but fluent answers may suppress verification. Source-linked interfaces improve source checking.',brief:['Fluent summaries can reduce verification.','Controlled comparison of source-linked and source-hidden AI interfaces.','Visible provenance improves verification behavior.','Participants are mainly academic and R&D readers.']},{id:'p4',topic:'Local-first',title:'Local-First Knowledge Systems on Mobile Devices',authors:'P. Anders, H. Wang',match:89,reason:'Offline-first architecture + private research data',abs:'A local-first system remains usable without an account or cloud availability while network work happens opportunistically.',brief:['Cloud-first tools create latency and availability trade-offs.','Local object store plus local search and optional sync.','Offline use and perceived responsiveness improve.','Cross-device collaboration becomes secondary.']},{id:'p5',topic:'PDF Grounding',title:'Benchmarking Source-Grounded Question Answering Over PDFs',authors:'R. Iqbal, T. Sato',match:87,reason:'PDF source mapping + Jump to Source',abs:'Document QA citations should identify exact page, section and supporting span rather than only the document.',brief:['Document-level citations hide grounding failures.','Evaluate page/section/span provenance.','Fine-grained grounding reveals failures missed by document citations.','PDF extraction quality is an upstream dependency.']}];const BODY={'p1':['Long-context reasoning systems often scale context length faster than they improve evidence selection. The model can see more text, but useful evidence density may remain low.','We introduce a hierarchical context router that compresses candidate evidence into coherent regions, allocates a bounded reasoning budget to high-value regions, and preserves source offsets for every compressed span.','At query time the system retrieves candidate spans, reranks them and passes only the highest-value evidence windows to the reasoning model. Each answer carries evidence identifiers.','Preserving source metadata adds little retrieval cost while reducing manual verification time.'],'p2':['Dense retrieval is useful, but it is not automatically the right first choice for every personal research corpus.','Our baseline combines lexical retrieval, BM25 ranking, section-aware boosts and explicit provenance fields.','On bounded technical corpora the lexical-first design remains competitive while enabling deterministic offline search.'],'p3':['Participants used two AI reading interfaces: one exposed source location and uncertainty cues, while the other showed fluent answers without persistent verification affordances.','Source-linked interaction increased verification behavior and reduced uncritical acceptance of unsupported claims.'],'p4':['Offline should be treated as a normal operating state, not a degraded afterthought.','The application stores content objects, annotations and search indexes locally. Optional remote capabilities must never block navigation.'],'p5':['A useful citation must identify more than the document. Provenance includes paper identifier, page, section, source text and offsets.','Jump-to-source success should be evaluated separately from answer quality.']};const D={page:'today',topics:['AI Systems','RAG','Software Architecture'],saved:[],dismissed:[],objects:[],screened:0,reads:0,ai:0};let S=Object.assign({},D,JSON.parse(localStorage.rf||'{}'));let current='p1',filter='all';function save(){localStorage.rf=JSON.stringify(S)}function T(m){let e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',1500)}function nav(){return [['today','◉ Today'],['discover','⌕ Discover'],['library','▣ Library'],['insights','⌁ Insights'],['me','◎ Me']].map(x=>`<button class="${S.page==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function shell(){document.getElementById('app').innerHTML=`<div class="app"><aside class="side"><div class="brand">ResearchFlow<small>Web product experience</small></div><div class="nav">${nav()}</div><div class="panel" style="margin-top:18px"><b style="font-size:12px">My Topics</b><div style="margin-top:8px">${S.topics.slice(0,4).map(x=>`<span class="topic">${x}</span>`).join('')}</div></div></aside><main class="main"><header class="top"><div><b id="title"></b><div class="muted">Local-first product validation build</div></div><button class="btn" onclick="importPaper()">＋ Import</button></header><div id="content" class="content"></div></main></div><div class="mobile">${nav()}</div><div id="modal" class="modalbg"></div><div id="reader" class="reader"></div>`;go(S.page,false)}function go(p,persist=true){S.page=p;if(persist)save();document.querySelectorAll('.nav button,.mobile button').forEach(b=>b.classList.remove('on'));document.querySelectorAll('.nav button,.mobile button').forEach(b=>{if(b.getAttribute('onclick').includes(`'${p}'`))b.classList.add('on')});document.getElementById('title').textContent={today:'Today',discover:'Discover',library:'Library',insights:'Insights',me:'Me'}[p];document.getElementById('content').innerHTML={today:today,discover:discover,library:library,insights:insights,me:me}[p]()}function ranked(){return P.filter(x=>!S.dismissed.includes(x.id)).sort((a,b)=>b.match-a.match)}function card(p){return `<div class="card"><span class="tag">${p.topic}</span> <span class="tag">${p.match}% match</span><h3>${p.title}</h3><div class="muted">${p.authors}</div><div class="muted" style="color:#3159d9;margin-top:8px">${p.reason}</div><div class="actions"><button class="btn p" onclick="detail('${p.id}')">Evaluate</button><button class="btn" onclick="keep('${p.id}')">${S.saved.includes(p.id)?'Saved':'Save'}</button><button class="btn" onclick="dismiss('${p.id}')">Dismiss</button></div></div>`}function today(){let r=ranked();return `<div class="hero"><div><span class="tag" style="background:#ffffff20;color:#fff">Personal Research Radar</span><h1>Find what matters.<br>Understand it without losing the source.</h1><p>Discovery, screening, reading, contextual AI, source verification and research memory in one workflow.</p></div><div class="stats"><div><b>${r.length}</b><span>papers today</span></div><div><b>${S.screened}</b><span>screened</span></div><div><b>${S.ai}</b><span>AI actions</span></div><div><b>${S.objects.length}</b><span>objects</span></div></div></div><div class="sec"><h2>Top Picks</h2><span class="muted">Based on explicit interests</span></div><div class="cards">${r.slice(0,3).map(card).join('')}</div><div class="sec"><h2>New Today</h2><span class="muted">Metadata only</span></div><div class="list">${r.slice(3).map(x=>`<div class="row"><div><span class="tag">${x.topic}</span><h3>${x.title}</h3><div class="muted">${x.reason}</div></div><button class="btn p" onclick="detail('${x.id}')">Evaluate</button></div>`).join('')||'<div class="panel muted">No more new papers.</div>'}</div>`}function keep(id){if(!S.saved.includes(id))S.saved.push(id);let p=P.find(x=>x.id==id);if(!S.objects.find(x=>x.type=='paper'&&x.paper==id))S.objects.unshift({id:Date.now(),type:'paper',paper:id,title:p.title,detail:'Saved paper'});save();T('Saved to Library');go(S.page,false)}function dismiss(id){if(!S.dismissed.includes(id))S.dismissed.push(id);save();T('Dismissed');go('today',false)}function discover(){setTimeout(searchP,0);return `<div class="search"><input id="q" placeholder="Search title, author, topic…" oninput="searchP()"><button class="btn p" onclick="searchP()">Search</button></div><div class="chips">${['All','AI Systems','RAG','Human-AI Interaction','Local-first','PDF Grounding'].map(x=>`<button class="chip" onclick="document.getElementById('q').value='${x=='All'?'':x}';searchP()">${x}</button>`).join('')}</div><div id="results" class="list"></div>`}function searchP(){let e=document.getElementById('results');if(!e)return;let q=(document.getElementById('q').value||'').toLowerCase();let a=P.filter(x=>(x.title+x.authors+x.topic).toLowerCase().includes(q));e.innerHTML=a.map(x=>`<div class="row"><div><span class="tag">${x.topic}</span><h3>${x.title}</h3><div class="muted">${x.authors}</div></div><button class="btn p" onclick="detail('${x.id}')">Evaluate</button></div>`).join('')||'<div class="panel muted">No results.</div>'}function detail(id){current=id;S.screened++;save();let p=P.find(x=>x.id==id),m=document.getElementById('modal');m.classList.add('show');m.innerHTML=`<div class="modal"><div class="mh"><b>Paper Detail</b><button class="btn" onclick="closeM()">Close</button></div><div class="mb"><div class="detail"><div><span class="tag">${p.topic}</span><h1>${p.title}</h1><div class="muted">${p.authors} · 2026</div><p style="line-height:1.65;color:#596273">${p.abs}</p><div class="actions"><button class="btn p" onclick="closeM();read('${id}')">Read Original</button><button class="btn" onclick="keep('${id}')">Save</button></div></div><div class="brief"><h3>Before you read</h3>${['Problem','Method','Key result','Limitation'].map((x,i)=>`<div><b style="font-size:12px">${x}</b><br><span class="muted">${p.brief[i]}</span></div>`).join('')}</div></div></div></div>`}function closeM(){let m=document.getElementById('modal');m.classList.remove('show');m.innerHTML=''}function read(id){current=id;S.reads++;save();let p=P.find(x=>x.id==id),b=BODY[id]||[p.abs];let r=document.getElementById('reader');r.classList.add('show');r.innerHTML=`<div class="rt"><button class="btn" onclick="closeR()">← Done</button><b>${p.title}</b><span class="tag">p.12</span></div><div class="rb"><aside class="outline"><b>Outline</b>${b.map((x,i)=>`<div class="muted" style="padding:10px 0">${i+1}. Section ${i+1}</div>`).join('')}</aside><div class="paperwrap"><article class="paper"><div class="muted">ResearchFlow demo paper</div><h1>${p.title}</h1><div class="muted">${p.authors}</div>${b.map((x,i)=>`<h2>Section ${i+1}</h2><p id="src${i}" class="${i==1?'sel':''}">${x}</p>`).join('')}</article></div><aside class="ai"><b>Contextual AI</b><div class="muted">Grounded to current paper</div><select id="ctx" style="margin-top:10px;padding:8px"><option>Selection</option><option>Paragraph</option><option>Section</option><option>Abstract</option></select><div class="aiBtns"><button onclick="AI('Translate')">Translate</button><button onclick="AI('Explain')">Explain</button><button onclick="AI('Summarize')">Summarize</button><button onclick="AI('Ask')">Ask AI</button></div><div id="answer" class="box">Select an action. AI output stays linked to a source location.<div class="cite" onclick="jump()">Source · Section 2 · p.12 · Jump to Source →</div></div><div class="capture"><button onclick="capture('passage')">Save Passage</button><button onclick="capture('note')">Add Note</button><button onclick="capture('ai')">Save AI Insight</button><button onclick="capture('highlight')">Highlight</button></div></aside></div>`}function AI(k){S.ai++;save();let text={Translate:'The core idea is to select high-value evidence first, focus reasoning resources there, and preserve original source locations for verification.',Explain:'The key distinction is between seeing more text and selecting better evidence. ResearchFlow should make source verification a first-class interaction, not an afterthought.',Summarize:'Prioritize evidence, preserve provenance, and make every AI claim easy to verify against the paper.',Ask:'Pay attention to whether the claimed improvement comes from better retrieval, better reasoning, or simply more context.'}[k];document.getElementById('answer').innerHTML=`<b>${k}</b><br><br>${text}<div class="cite" onclick="jump()">Grounding · Section 2 · p.12 · ${document.getElementById('ctx').value} →</div>`}function jump(){document.getElementById('src1')?.scrollIntoView({behavior:'smooth',block:'center'});T('Jumped to source')}function capture(type){let p=P.find(x=>x.id==current),src=(BODY[current]||[p.abs])[1]||p.abs,title=type=='note'?(prompt('Your note:','Compare this evidence with my current research assumptions.')||''):src.slice(0,120);if(!title)return;S.objects.unshift({id:Date.now(),type,paper:current,title,detail:`${p.title} · Section 2 · p.12`});save();T(type+' saved')}function closeR(){document.getElementById('reader').classList.remove('show');go(S.page,false)}function library(){setTimeout(lib,0);return `<div class="search"><input id="lq" placeholder="Search your research memory" oninput="lib()"></div><div class="chips">${['all','paper','passage','note','ai','highlight'].map(x=>`<button class="chip ${filter==x?'on':''}" onclick="filter='${x}';lib()">${x}</button>`).join('')}</div><div id="lib" class="list"></div>`}function lib(){let e=document.getElementById('lib');if(!e)return;let q=(document.getElementById('lq').value||'').toLowerCase();let a=S.objects.filter(x=>(filter=='all'||x.type==filter)&&(x.title+x.detail).toLowerCase().includes(q));e.innerHTML=a.map(x=>`<div class="row"><div><span class="tag">${x.type}</span><h3>${x.title}</h3><div class="muted">${x.detail}</div></div><button class="btn" onclick="read('${x.paper}')">Open source</button></div>`).join('')||'<div class="panel muted">No research objects yet. Save a passage or note from Reader.</div>'}function insights(){let c={};S.objects.forEach(x=>c[x.type]=(c[x.type]||0)+1);return `<div class="cards"><div class="card"><b style="font-size:30px">${S.screened}</b><div class="muted">Papers screened</div></div><div class="card"><b style="font-size:30px">${S.reads}</b><div class="muted">Reader opens</div></div><div class="card"><b style="font-size:30px">${S.ai}</b><div class="muted">AI actions</div></div></div><div class="grid2" style="margin-top:12px"><div class="panel"><h3>Capture pattern</h3>${Object.entries(c).map(([k,v])=>`<p><b>${k}</b> <span class="muted">${v}</span></p>`).join('')||'<span class="muted">No captures yet.</span>'}</div><div class="panel"><h3>What this validates</h3><p class="muted">Insights are intentionally local and non-generative in P0. The key value test is whether discovery → reading → grounded AI → memory feels better than switching between separate tools.</p></div></div>`}function me(){return `<div class="grid2"><div class="panel"><h3>Research Profile</h3><div>${S.topics.map(x=>`<span class="topic">${x} <button style="border:0;background:transparent" onclick="rm('${x}')">×</button></span>`).join('')}</div><div class="actions"><button class="btn" onclick="addT()">＋ Topic</button></div><div class="setting"><div><strong>UI language</strong><span class="muted">Independent from paper language</span></div><select><option>English</option><option>日本語</option><option>한국어</option><option>繁體中文</option></select></div><div class="setting"><div><strong>AI response language</strong><span class="muted">Independent from UI language</span></div><select><option>English</option><option>日本語</option><option>한국어</option><option>繁體中文</option></select></div></div><div class="panel"><h3>Privacy & Storage</h3><div class="setting"><div><strong>Local-first</strong><span class="muted">Data persists in this browser using localStorage.</span></div><span class="tag">ON</span></div><div class="setting"><div><strong>LLM Provider</strong><span class="muted">This public preview uses demo AI responses.</span></div><span class="tag">Demo</span></div><div class="setting"><div><strong>Reset experience</strong><span class="muted">Deletes local prototype state on this browser.</span></div><button class="btn" onclick="reset()">Reset</button></div></div></div>`}function addT(){let x=prompt('Add research interest:','Agentic AI');if(x&&!S.topics.includes(x)){S.topics.push(x);save();go('me',false)}}function rm(x){S.topics=S.topics.filter(t=>t!=x);save();go('me',false)}function reset(){if(confirm('Delete local prototype state?')){localStorage.removeItem('rf');S=JSON.parse(JSON.stringify(D));shell()}}function importPaper(){alert('Web preview import flow: the production iOS app will import Files/PDF/URL/arXiv. This hosted validation build keeps the core product loop focused on Radar → Evaluate → Reader → AI → Library.')}shell();</script></body></html>
